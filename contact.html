<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact · EVForecast</title>
  <script>
    (function () {
      var parts = location.pathname.split("/").filter(Boolean);
      var base = location.hostname.indexOf("github.io") !== -1 && parts[0]
        ? "/" + parts[0] + "/"
        : location.pathname.replace(/[^/]*$/, "") || "/";
      document.write('<base href="' + base + '">');
    })();
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="frontend/static/css/style.css" />
</head>
<body>
<div id="navHost"></div>
<main>
<section class="section">
  <div class="container" style="max-width:720px">
    <div class="glass p-4">
      <h1 class="h3">Contact</h1>
      <p class="text-muted-2 mb-4">Messages on GitHub Pages are saved in your browser only (no server database).</p>
      <form id="contactForm" class="row g-3">
        <div class="col-md-6"><label class="form-label">Name</label><input class="form-control" name="name" required /></div>
        <div class="col-md-6"><label class="form-label">Email</label><input class="form-control" type="email" name="email" required /></div>
        <div class="col-12"><label class="form-label">Message</label><textarea class="form-control" name="message" rows="4" required></textarea></div>
        <div class="col-12"><button class="btn btn-glow" type="submit">Send</button></div>
      </form>
      <div id="contactMsg" class="mt-3 text-muted-2"></div>
    </div>
  </div>
</section>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="frontend/static/js/app.js"></script>
<script src="site/core.js"></script>
<script src="site/chrome.js"></script>
<script>
document.getElementById("contactForm").addEventListener("submit", (e) => {
  e.preventDefault();
  const fd = new FormData(e.target);
  const item = {
    name: fd.get("name"),
    email: fd.get("email"),
    message: fd.get("message"),
    at: new Date().toISOString()
  };
  const list = JSON.parse(localStorage.getItem("evforecast_pages_contacts") || "[]");
  list.push(item);
  localStorage.setItem("evforecast_pages_contacts", JSON.stringify(list));
  document.getElementById("contactMsg").textContent = "Saved locally. Thank you!";
  e.target.reset();
});
</script>
</body>
</html>
