<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Model Comparison · EVForecast</title>
  <script>
    (function () {
      var parts = location.pathname.split("/").filter(Boolean);
      var base = location.hostname.indexOf("github.io") !== -1 && parts[0]
        ? "/" + parts[0] + "/"
        : location.pathname.replace(/[^/]*$/, "") || "/";
      document.write('<base href="' + base + '">');
    })();
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="frontend/static/css/style.css" />
</head>
<body>
<div id="navHost"></div>
<main>
<section class="section">
  <div class="container">
    <h1 class="h2 mb-2">Model Comparison</h1>
    <p class="text-muted-2 mb-4">Accuracy under 100%. MAE, RMSE, MAPE, R² from project evaluation results.</p>
    <div class="glass p-3 mb-4"><canvas id="cmpChart" height="120"></canvas></div>
    <div class="glass p-3 table-responsive">
      <table class="table align-middle" id="cmpTable">
        <thead><tr><th>Model</th><th>Accuracy %</th><th>MAE</th><th>RMSE</th><th>MAPE</th><th>R²</th><th>F1</th></tr></thead>
        <tbody></tbody>
      </table>
    </div>
  </div>
</section>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
<script src="frontend/static/js/app.js"></script>
<script src="site/core.js"></script>
<script src="site/chrome.js"></script>
<script>
(async () => {
  const cmp = await EVPagesData.comparison();
  const names = Object.keys(cmp).filter((k) => cmp[k].RMSE != null);
  const acc = (m) => Math.min(99.9, Number(m.Accuracy ?? ((m.R2 || 0) * 100)));
  document.querySelector("#cmpTable tbody").innerHTML = names.map((n) => {
    const m = cmp[n];
    return `<tr><td>${n}</td><td>${acc(m).toFixed(1)}%</td><td>${m.MAE}</td><td>${m.RMSE}</td><td>${m.MAPE}</td><td>${m.R2}</td><td>${m.F1 ?? "—"}</td></tr>`;
  }).join("");
  new Chart(document.getElementById("cmpChart"), {
    type: "bar",
    data: {
      labels: names,
      datasets: [{
        label: "Accuracy %",
        data: names.map((n) => acc(cmp[n])),
        borderColor: "#2dd4bf",
        backgroundColor: "rgba(45,212,191,0.35)",
        borderWidth: 1
      }]
    },
    options: {
      plugins: { legend: { labels: { color: "#cfe3ec" } } },
      scales: {
        x: { ticks: { color: "#8fa3b0", maxRotation: 60 }, grid: { display: false } },
        y: { max: 100, ticks: { color: "#8fa3b0" }, grid: { color: "rgba(255,255,255,0.04)" } }
      }
    }
  });
})();
</script>
</body>
</html>
