{% extends "base.html" %}
{% block title %}Contact · EVForecast{% endblock %}
{% block head %}<script src="../static/js/live-server-bridge.js"></script>{% endblock %}
{% block content %}
<section class="section">
  <div class="container" style="max-width:720px">
    <div class="glass p-4">
      <h1 class="h3">Contact</h1>
      <p class="text-muted-2 mb-4">Send a message — it is saved to the project database for the team / admin to review.</p>
      <form id="contactForm" novalidate>
        <div class="mb-3">
          <label class="form-label" for="cName">Name</label>
          <input class="form-control" id="cName" name="name" required maxlength="120" autocomplete="name" />
        </div>
        <div class="mb-3">
          <label class="form-label" for="cEmail">Email</label>
          <input type="email" class="form-control" id="cEmail" name="email" required maxlength="180" autocomplete="email" />
        </div>
        <div class="mb-3">
          <label class="form-label" for="cSubject">Subject <span class="text-muted-2">(optional)</span></label>
          <input class="form-control" id="cSubject" name="subject" maxlength="200" placeholder="e.g. Project demo / viva query" />
        </div>
        <div class="mb-3">
          <label class="form-label" for="cMessage">Message</label>
          <textarea class="form-control" id="cMessage" name="message" rows="5" required maxlength="5000"></textarea>
        </div>
        <button class="btn btn-glow" type="submit" id="contactSubmit">Send message</button>
        <div class="auth-error mt-3" id="contactError"></div>
        <div class="contact-success mt-3 d-none" id="contactSuccess" role="status"></div>
      </form>
    </div>
  </div>
</section>
{% endblock %}
{% block scripts %}
<script>
(() => {
  const form = document.getElementById("contactForm");
  const err = document.getElementById("contactError");
  const ok = document.getElementById("contactSuccess");
  const btn = document.getElementById("contactSubmit");
  const user = EVForecast.currentUser();
  if (user) {
    if (user.name) document.getElementById("cName").value = user.name;
    if (user.email) document.getElementById("cEmail").value = user.email;
  }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    err.classList.remove("show");
    err.textContent = "";
    ok.classList.add("d-none");
    ok.textContent = "";

    const body = {
      name: document.getElementById("cName").value.trim(),
      email: document.getElementById("cEmail").value.trim(),
      subject: document.getElementById("cSubject").value.trim(),
      message: document.getElementById("cMessage").value.trim(),
    };

    btn.disabled = true;
    btn.textContent = "Sending…";
    try {
      const res = await EVForecast.API.contact(body);
      ok.textContent = res.message || "Message sent successfully.";
      ok.classList.remove("d-none");
      form.reset();
      if (user) {
        if (user.name) document.getElementById("cName").value = user.name;
        if (user.email) document.getElementById("cEmail").value = user.email;
      }
    } catch (ex) {
      err.textContent = ex.data?.message || ex.message || "Could not send message.";
      err.classList.add("show");
    } finally {
      btn.disabled = false;
      btn.textContent = "Send message";
    }
  });
})();
</script>
{% endblock %}
