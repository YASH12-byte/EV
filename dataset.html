<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dataset · EVForecast</title>
  <script>
    (function () {
      var parts = location.pathname.split("/").filter(Boolean);
      var base = location.hostname.indexOf("github.io") !== -1 && parts[0]
        ? "/" + parts[0] + "/"
        : location.pathname.replace(/[^/]*$/, "") || "/";
      document.write('<base href="' + base + '">');
    })();
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="frontend/static/css/style.css" />
</head>
<body>
<div id="navHost"></div>
<main>
<section class="section">
  <div class="container">
    <h1 class="h2 mb-2">Dataset</h1>
    <p class="text-muted-2 mb-4">Processed EV registration series from DataSet.zip (state-wise annual).</p>
    <div class="row g-3" id="dsCards"></div>
    <div class="glass p-4 mt-4">
      <h2 class="h5">Features &amp; Target</h2>
      <p class="mb-1"><strong>Target:</strong> <code>Registrations</code></p>
      <p class="mb-0 text-muted-2">Features include Year, State, VehicleType, lag / rolling growth signals used by the forecasting pipeline.</p>
    </div>
  </div>
</section>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="frontend/static/js/app.js"></script>
<script src="site/core.js"></script>
<script src="site/chrome.js"></script>
<script>
(async () => {
  const annual = await EVPagesData.annual();
  const national = await EVPagesData.national();
  const states = new Set(annual.map((r) => r.state).filter((s) => s && s !== "ALL"));
  const years = annual.map((r) => r.year).filter(Number.isFinite);
  document.getElementById("dsCards").innerHTML = [
    ["States / UTs", states.size],
    ["Rows", annual.length.toLocaleString()],
    ["Year span", `${Math.min(...years)}–${Math.max(...years)}`],
    ["National peak", Math.max(...national.map((p) => p.value)).toLocaleString()]
  ].map(([label, value]) =>
    `<div class="col-md-3"><div class="glass kpi"><div class="label">${label}</div><div class="value">${value}</div></div></div>`
  ).join("");
})();
</script>
</body>
</html>
