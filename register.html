<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register · EVForecast</title>
  <script>
    (function () {
      var parts = location.pathname.split("/").filter(Boolean);
      var base = location.hostname.indexOf("github.io") !== -1 && parts[0]
        ? "/" + parts[0] + "/"
        : location.pathname.replace(/[^/]*$/, "") || "/";
      document.write('<base href="' + base + '">');
    })();
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="frontend/static/css/style.css" />
</head>
<body class="auth-body">
<main class="section">
  <div class="container" style="max-width:480px">
    <div class="glass p-4">
      <h1 class="h3">Create Account</h1>
      <p class="text-muted-2">Demo accounts are stored in this browser only.</p>
      <form id="regForm" class="row g-3">
        <div class="col-12"><label class="form-label">Name</label><input class="form-control" name="name" required /></div>
        <div class="col-12"><label class="form-label">Email</label><input class="form-control" type="email" name="email" required /></div>
        <div class="col-12"><label class="form-label">Password</label><input class="form-control" type="password" name="password" minlength="6" required /></div>
        <div class="col-12"><button class="btn btn-glow w-100" type="submit">Register</button></div>
      </form>
      <div id="regError" class="auth-error mt-3"></div>
      <a class="btn btn-ghost w-100 mt-2" href="index.html">Back to Login</a>
    </div>
  </div>
</main>
<script src="frontend/static/js/app.js"></script>
<script src="site/core.js"></script>
<script>
document.getElementById("regForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const fd = new FormData(e.target);
  const err = document.getElementById("regError");
  err.classList.remove("show");
  try {
    await EVForecast.API.register({
      name: fd.get("name"),
      email: fd.get("email"),
      password: fd.get("password")
    });
    location.href = EVPages.href("/login");
  } catch (ex) {
    err.textContent = ex.data?.message || ex.message;
    err.classList.add("show");
  }
});
</script>
</body>
</html>
